name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install depends
      run:  |
       sudo apt install libsdl2-dev
       sudo apt install libsdl2-image-dev
       sudo apt install libsdl2-ttf-dev
       sudo apt install libsdl2-mixer-2.0-0
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make
      run: make
